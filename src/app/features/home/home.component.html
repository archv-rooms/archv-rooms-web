<!-- Fundo Parallax -->
<div class="parallax-bg">
  <div class="stars layer1"></div>
  <div class="stars layer2"></div>
  <div class="stars layer3"></div>
</div>

<div class="home-container">
  <!-- Hero Section com Terminal -->
  <section class="hero">
    <div class="terminal pixel-box">
      <div class="terminal-header">
        <div class="terminal-buttons">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
        </div>
        <span class="terminal-title">PROJETO_X.EXE</span>
      </div>
      <div class="terminal-body">
        <p *ngFor="let line of terminalLines"><span class="prompt">></span> {{ line }}</p>
        <p *ngIf="messageIndex < 3">
          <span class="prompt">></span> {{ currentTyping }}<span class="cursor">_</span>
        </p>
      </div>
    </div>
  </section>

  <!-- Grid de Planos -->
  <section class="pricing-section">
    <h2 class="section-title">CHOOSE YOUR CLASS</h2>
    
    <div class="pricing-grid">
      <div class="plan-card pixel-box" *ngFor="let plan of plans">
        <div class="plan-icon">{{ plan.icon }}</div>
        <h3 class="plan-name">{{ plan.name }}</h3>
        <div class="plan-price">{{ plan.price }}<span>/mês</span></div>
        
        <ul class="plan-benefits">
          <li *ngFor="let benefit of plan.benefits">
            <span class="bullet">►</span> {{ benefit }}
          </li>
        </ul>
        
        <a [routerLink]="['/checkout', plan.id]" class="btn-pixel plan-btn">{{ plan.buttonText }}</a>
      </div>
    </div>
  </section>
</div>
