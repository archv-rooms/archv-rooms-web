<div class="home-wrapper">

  <aside class="sidebar">
    <nav class="sidebar-nav">

      <button class="nav-btn" [class.active]="isActive('/home')" title="Home" (click)="navigate('/home')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
        </svg>
      </button>

      <button class="nav-btn" [class.active]="isActive('/library')" title="Biblioteca" (click)="navigate('/library')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M3 6h18M3 10h18M3 14h12M3 18h8"/>
        </svg>
      </button>

      <button class="nav-btn" [class.active]="isActive('/pricing')" title="Planos" (click)="navigate('/pricing')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>

      <button class="nav-btn" [class.donate-active]="isActive('/donate')" title="Apoiar" (click)="navigate('/donate')">
        <svg class="heart-glow" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" fill="none">
          <path d="M12 21C12 21 3 14.5 3 8.5a4.5 4.5 0 0 1 9-0.5 4.5 4.5 0 0 1 9 .5c0 6-9 12.5-9 12.5z"/>
        </svg>
      </button>

      <button class="nav-btn" [class.active]="isActive('/profile')" title="Perfil" *ngIf="isLoggedIn" (click)="navigate('/profile')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
      </button>

      <button class="nav-btn" [class.active]="isActive('/friends')" title="Amigos" *ngIf="isLoggedIn" (click)="navigate('/friends')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75M21 21v-2a4 4 0 0 0-3-3.85"/>
        </svg>
      </button>

      <button class="nav-btn" [class.active]="isActive('/leaderboard')" title="Placar" (click)="navigate('/leaderboard')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M3 20h18M8 20V10m4 10V4m4 16v-6"/>
        </svg>
      </button>

      <button class="nav-btn" [class.active]="isActive('/history')" title="Histórico" *ngIf="isLoggedIn" (click)="navigate('/history')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>
        </svg>
      </button>

      <button class="nav-btn" title="Admin" *ngIf="isAdmin" (click)="navigate('/admin')">
        <svg class="star-glow" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" fill="none">
          <path d="M12 2l3 7h7l-6 4.5 2.3 7L12 17l-6.3 3.5L8 13 2 8.5h7z"/>
        </svg>
      </button>

    </nav>
  </aside>

  <main class="main-content">

    <header class="topbar">
      <span class="topbar-brand">▣ ARCHV.ROOMS</span>
      <div class="topbar-right">
        <ng-container *ngIf="isLoggedIn">
          <span class="topbar-user" (click)="navigate('/profile')">{{ userName }}</span>
          <button class="btn btn-ghost btn-sm" (click)="logout()">sair</button>
        </ng-container>
      </div>
    </header>

    <div class="scroll-body">

      <div class="feedback-toast" *ngIf="feedbackMessage()"
        [class.success]="feedbackType() === 'success'"
        [class.error]="feedbackType() === 'error'">
        {{ feedbackMessage() }}
      </div>

      <section class="section">

        <!-- HEADER -->
        <div class="page-header">
          <div class="page-header-left">
            <span class="page-title">notificações</span>
            <span class="unread-pill" *ngIf="unreadCount() > 0">{{ unreadCount() }} novas</span>
          </div>
          <button class="btn-mark-all" *ngIf="unreadCount() > 0" (click)="markAllAsRead()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="12" height="12">
              <path d="M20 6L9 17l-5-5"/>
            </svg>
            marcar todas como lidas
          </button>
        </div>

        <!-- FILTROS -->
        <div class="filter-tabs">
          <button class="filter-tab" [class.active]="activeFilter() === 'all'" (click)="setFilter('all')">
            todas
          </button>
          <button class="filter-tab" [class.active]="activeFilter() === 'unread'" (click)="setFilter('unread')">
            não lidas
            <span class="tab-badge" *ngIf="unreadCount() > 0">{{ unreadCount() }}</span>
          </button>
        </div>

        <p class="loading" *ngIf="isLoading()">
          <span class="loading-dot"></span>
          <span class="loading-dot"></span>
          <span class="loading-dot"></span>
        </p>

        <!-- ESTADO VAZIO -->
        <div class="empty-state" *ngIf="!isLoading() && groupedNotifications().length === 0">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" width="40" height="40">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span>nenhuma notificação</span>
          <span class="empty-sub">você está em dia com tudo</span>
        </div>

        <!-- GRUPOS -->
        <div class="groups" *ngIf="!isLoading()">
          <div class="group" *ngFor="let group of groupedNotifications()">

            <div class="group-label">
              <span>{{ group.label }}</span>
              <div class="group-line"></div>
            </div>

            <div class="notification-list">
              <div class="notification-card"
                *ngFor="let n of group.items"
                [class.unread]="!n.read"
                [class.responded]="n._responded"
                (click)="markAsRead(n.id)">

                <!-- ÍCONE -->
                <div class="notif-icon-wrap" [class.type-friend]="n.type === 'friend_request' || n.type === 'friend_accepted'" [class.type-activity]="n.type === 'activity'" [class.type-challenge]="n.type === 'challenge'">
                  <svg *ngIf="n.type === 'friend_request'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16">
                    <circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75M21 21v-2a4 4 0 0 0-3-3.85"/>
                  </svg>
                  <svg *ngIf="n.type === 'friend_accepted'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16">
                    <path d="M20 6L9 17l-5-5"/>
                  </svg>
                  <svg *ngIf="n.type === 'activity'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16">
                    <polygon points="5 3 19 12 5 21 5 3"/>
                  </svg>
                  <svg *ngIf="n.type === 'challenge'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16">
                    <path d="M14.5 10c-.83 0-1.5-.67-1.5-1.5v-5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5v5c0 .83-.67 1.5-1.5 1.5z"/>
                    <path d="M20.5 10H19V8.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
                    <path d="M9.5 14c.83 0 1.5.67 1.5 1.5v5c0 .83-.67 1.5-1.5 1.5S8 21.33 8 20.5v-5c0-.83.67-1.5 1.5-1.5z"/>
                    <path d="M3.5 14H5v1.5c0 .83-.67 1.5-1.5 1.5S2 16.33 2 15.5 2.67 14 3.5 14z"/>
                    <path d="M14 14.5c0-.83.67-1.5 1.5-1.5h5c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5h-5c-.83 0-1.5-.67-1.5-1.5z"/>
                    <path d="M15.5 19H14v1.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5-.67-1.5-1.5-1.5z"/>
                    <path d="M10 9.5C10 8.67 9.33 8 8.5 8h-5C2.67 8 2 8.67 2 9.5S2.67 11 3.5 11h5c.83 0 1.5-.67 1.5-1.5z"/>
                    <path d="M8.5 5H10V3.5C10 2.67 9.33 2 8.5 2S7 2.67 7 3.5 7.67 5 8.5 5z"/>
                  </svg>
                  <svg *ngIf="n.type !== 'friend_request' && n.type !== 'friend_accepted' && n.type !== 'activity' && n.type !== 'challenge'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16">
                    <circle cx="12" cy="12" r="4"/>
                  </svg>
                  <span class="unread-dot" *ngIf="!n.read"></span>
                </div>

                <!-- CONTEÚDO -->
                <div class="notif-content">
                  <span class="notif-title">{{ n.title }}</span>
                  <span class="notif-body">{{ n.body }}</span>

                  <!-- AÇÕES INLINE PARA CONVITE -->
                  <div class="notif-actions" *ngIf="n.type === 'friend_request' && !n._responded && n.data?.friendshipId"
                    (click)="$event.stopPropagation()">
                    <button class="btn-accept" (click)="respondFriendRequest(n, 'accepted')">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="11" height="11"><path d="M20 6L9 17l-5-5"/></svg>
                      aceitar
                    </button>
                    <button class="btn-reject" (click)="respondFriendRequest(n, 'rejected')">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="11" height="11"><path d="M18 6L6 18M6 6l12 12"/></svg>
                      recusar
                    </button>
                  </div>

                  <span class="responded-tag" *ngIf="n._responded">respondido ✓</span>

                  <span class="notif-date">{{ n.createdAt | date:'dd/MM/yyyy HH:mm' }}</span>
                </div>

                <!-- DELETAR -->
                <button class="notif-delete" (click)="$event.stopPropagation(); deleteNotification(n.id)" title="remover">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="12" height="12">
                    <path d="M18 6L6 18M6 6l12 12"/>
                  </svg>
                </button>

              </div>
            </div>
          </div>
        </div>

      </section>
    </div>
  </main>

  <div class="crt-overlay"></div>
  <div class="scanlines"></div>

</div>
