<div class="home-wrapper">

  <aside class="sidebar">
    <nav class="sidebar-nav">

      <button class="nav-btn" [class.active]="isActive('/home')" title="Home" (click)="navigate('/home')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
        </svg>
      </button>

      <button class="nav-btn" [class.active]="isActive('/library')" title="Biblioteca" (click)="navigate('/library')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M3 6h18M3 10h18M3 14h12M3 18h8"/>
        </svg>
      </button>

      <button class="nav-btn" [class.active]="isActive('/pricing')" title="Planos" (click)="navigate('/pricing')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>

      <button class="nav-btn" [class.donate-active]="isActive('/donate')" title="Apoiar" (click)="navigate('/donate')">
        <svg class="heart-glow" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" fill="none">
          <path d="M12 21C12 21 3 14.5 3 8.5a4.5 4.5 0 0 1 9-0.5 4.5 4.5 0 0 1 9 .5c0 6-9 12.5-9 12.5z"/>
        </svg>
      </button>

      <button class="nav-btn" [class.active]="isActive('/profile')" title="Perfil" *ngIf="isLoggedIn" (click)="navigate('/profile')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
      </button>

      <button class="nav-btn" [class.active]="isActive('/friends')" title="Amigos" *ngIf="isLoggedIn" (click)="navigate('/friends')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75M21 21v-2a4 4 0 0 0-3-3.85"/>
        </svg>
      </button>

      <button class="nav-btn" title="Admin" *ngIf="isAdmin" (click)="navigate('/admin')">
        <svg class="star-glow" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" fill="none">
          <path d="M12 2l3 7h7l-6 4.5 2.3 7L12 17l-6.3 3.5L8 13 2 8.5h7z"/>
        </svg>
      </button>

    </nav>
  </aside>

  <main class="main-content">

    <header class="topbar">
      <span class="topbar-brand">▣ ARCHV.ROOMS</span>
      <div class="topbar-right">
        <ng-container *ngIf="isLoggedIn">
          <span class="topbar-user" (click)="navigate('/profile')">{{ userName }}</span>
          <button class="btn btn-ghost btn-sm" (click)="logout()">sair</button>
        </ng-container>
      </div>
    </header>

    <div class="scroll-body">

      <div class="feedback-toast" *ngIf="feedbackMessage()"
        [class.success]="feedbackType() === 'success'"
        [class.error]="feedbackType() === 'error'">
        {{ feedbackMessage() }}
      </div>

      <section class="section">
        <div class="section-header">
          <span class="section-label">notificações</span>
          <button class="btn-mark-all" *ngIf="notifications().length > 0" (click)="markAllAsRead()">
            marcar todas como lidas
          </button>
        </div>

        <p class="loading" *ngIf="isLoading()">carregando...</p>

        <p class="empty-state" *ngIf="!isLoading() && notifications().length === 0">
          Nenhuma notificação.
        </p>

        <div class="notification-list">
          <div class="notification-card" *ngFor="let n of notifications()"
            [class.unread]="!n.read"
            (click)="markAsRead(n.id)">
            <div class="notif-icon">{{ getTypeIcon(n.type) }}</div>
            <div class="notif-content">
              <span class="notif-title">{{ n.title }}</span>
              <span class="notif-body">{{ n.body }}</span>
              <span class="notif-date">{{ n.createdAt | date:'dd/MM/yyyy HH:mm' }}</span>
            </div>
            <button class="notif-delete" (click)="$event.stopPropagation(); deleteNotification(n.id)">✕</button>
          </div>
        </div>

      </section>
    </div>
  </main>

  <div class="crt-overlay"></div>
  <div class="scanlines"></div>

</div>
