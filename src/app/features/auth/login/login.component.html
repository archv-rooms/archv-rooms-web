<div class="auth-container">
  <div class="pixel-box auth-box">
    <h2 class="auth-title">INSERT COIN TO LOGIN</h2>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email">E-MAIL</label>
        <input type="email" id="email" formControlName="email" class="pixel-input" placeholder="player@domain.com">
        <span class="error-msg" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          * E-mail inválido ou obrigatório.
        </span>
      </div>

      <div class="form-group">
        <label for="password">PASSWORD</label>
        <input type="password" id="password" formControlName="password" class="pixel-input" placeholder="******">
        <span class="error-msg" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          * Senha deve ter no mínimo 6 caracteres.
        </span>
      </div>

      <div class="server-error" *ngIf="errorMessage">
        [ERROR] {{ errorMessage }}
      </div>

      <button type="submit" class="btn-pixel submit-btn" [disabled]="isLoading">
        {{ isLoading ? 'LOADING...' : 'START' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>New player? <a routerLink="/register">Create Account</a></p>
    </div>
  </div>
</div>
