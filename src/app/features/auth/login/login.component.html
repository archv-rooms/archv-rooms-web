<div class="auth-wrapper">
  <div class="bg-grid"></div>
  <div class="scanlines"></div>

  <div class="auth-terminal">

    <!-- Header -->
    <div class="terminal-header">
      <button class="back-btn" routerLink="/">
        <span class="back-arrow">←</span>
        <span class="back-text">HOME</span>
      </button>

      <span class="terminal-status">● SECURE</span>
    </div>

    <!-- Auth box -->
    <div class="auth-body">

      <div class="auth-header">
        <div class="auth-icon">▶</div>

        <div>
          <h1 class="auth-title">LOGIN</h1>
          <p class="auth-subtitle">insira suas credenciais</p>
        </div>
      </div>

      <form
        [formGroup]="loginForm"
        (ngSubmit)="onSubmit()"
        class="auth-form"
        autocomplete="off"
      >

        <!-- EMAIL -->
        <div class="field-group">

          <div
            class="field-wrapper"
            [class.field-error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
          >
            <span class="field-icon">@</span>

            <input
              type="email"
              formControlName="email"
              class="field-input"
              placeholder="e-mail"
              autocomplete="off"
            >
          </div>

          <span
            class="error-msg"
            *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
          >
            ⚠ e-mail inválido
          </span>

        </div>

        <!-- PASSWORD -->
        <div class="field-group">

          <div
            class="field-wrapper"
            [class.field-error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          >
            <span class="field-icon">▒</span>

            <input
              type="password"
              formControlName="password"
              class="field-input"
              placeholder="senha"
              autocomplete="current-password"
            >
          </div>

          <span
            class="error-msg"
            *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          >
            ⚠ mínimo 6 caracteres
          </span>

        </div>

        <!-- SERVER ERROR -->
        <div class="server-error" *ngIf="errorMessage">
          <span class="error-tag">[DENIED]</span>
          {{ errorMessage }}
        </div>

        <!-- SUBMIT -->
        <button
          type="submit"
          class="btn-submit"
          [disabled]="isLoading"
        >

          <span *ngIf="!isLoading">
            ENTRAR ▶
          </span>

          <span
            *ngIf="isLoading"
            class="loading-text"
          >
            AUTENTICANDO
            <span class="dots">...</span>
          </span>

        </button>

      </form>

      <!-- FOOTER -->
      <div class="auth-footer">

        <p class="footer-text">
          novo na rede?
        </p>

        <a
          routerLink="/register"
          class="footer-link"
        >
          <span class="link-arrow">→</span>
          <span class="link-text">CRIAR CONTA</span>
        </a>

      </div>

    </div>

  </div>
</div>
