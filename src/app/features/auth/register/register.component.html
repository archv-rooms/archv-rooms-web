<div class="auth-wrapper">
  <div class="bg-grid"></div>
  <div class="scanlines"></div>

  <div class="auth-terminal">

    <!-- Header -->
    <div class="terminal-header">
      <button class="back-btn" routerLink="/">
        <span class="back-arrow">←</span>
        <span class="back-text">HOME</span>
      </button>
      <span class="terminal-status">● OPEN</span>
    </div>

    <!-- Auth box -->
    <div class="auth-body">
      <div class="auth-header">
        <div class="auth-icon">✦</div>
        <div>
          <h1 class="auth-title">CADASTRO</h1>
          <p class="auth-subtitle">crie sua conta na rede</p>
        </div>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form" autocomplete="off">

        <div class="field-group">
          <div class="field-wrapper" [class.field-error]="registerForm.get('name')?.invalid && registerForm.get('name')?.touched">
            <span class="field-icon">▣</span>
            <input type="text" formControlName="name" class="field-input" placeholder="nome" autocomplete="off">
          </div>
          <span class="error-msg" *ngIf="registerForm.get('name')?.invalid && registerForm.get('name')?.touched">⚠ mínimo 3 caracteres</span>
        </div>

        <div class="field-group">
          <div class="field-wrapper" [class.field-error]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
            <span class="field-icon">@</span>
            <input type="email" formControlName="email" class="field-input" placeholder="e-mail" autocomplete="off">
          </div>
          <span class="error-msg" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">⚠ e-mail inválido</span>
        </div>

        <div class="field-group">
          <div class="field-wrapper" [class.field-error]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
            <span class="field-icon">▒</span>
            <input type="password" formControlName="password" class="field-input" placeholder="senha" autocomplete="new-password">
          </div>
          <span class="error-msg" *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">⚠ mínimo 6 caracteres</span>
        </div>

        <div class="server-error" *ngIf="errorMessage">
          <span class="error-tag">[DENIED]</span> {{ errorMessage }}
        </div>

        <div class="server-success" *ngIf="successMessage">
          <span class="success-tag">[OK]</span> {{ successMessage }}
        </div>

        <div class="server-error" *ngIf="errorMessage">
          <span class="error-tag">[DENIED]</span> {{ errorMessage }}
        </div>

        <button type="submit" class="btn-submit" [disabled]="isLoading">
          <span *ngIf="!isLoading">CRIAR CONTA </span>
          <span *ngIf="isLoading" class="loading-text">CRIANDO<span class="dots">...</span></span>
        </button>

      </form>

      <div class="auth-footer">

        <p class="footer-text">
          já tem conta?
        </p>
      
        <a
          routerLink="/login"
          class="footer-link"
        >
          <span class="link-arrow">←</span>
          <span class="link-text">ENTRAR</span>
        </a>
      
      </div>
    </div>

  </div>
</div>
