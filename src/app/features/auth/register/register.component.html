<div class="auth-container">
  <div class="pixel-box auth-box">
    <h2 class="auth-title">NEW PLAYER REGISTRATION</h2>
    
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="name">PLAYER NAME</label>
        <input type="text" id="name" formControlName="name" class="pixel-input" placeholder="Player 1">
        <span class="error-msg" *ngIf="registerForm.get('name')?.invalid && registerForm.get('name')?.touched">
          * Nome deve ter no mínimo 3 caracteres.
        </span>
      </div>

      <div class="form-group">
        <label for="email">E-MAIL</label>
        <input type="email" id="email" formControlName="email" class="pixel-input" placeholder="player@domain.com">
        <span class="error-msg" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
          * E-mail inválido ou obrigatório.
        </span>
      </div>

      <div class="form-group">
        <label for="password">PASSWORD</label>
        <input type="password" id="password" formControlName="password" class="pixel-input" placeholder="******">
        <span class="error-msg" *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
          * Senha deve ter no mínimo 6 caracteres.
        </span>
      </div>

      <div class="server-error" *ngIf="errorMessage">
        [ERROR] {{ errorMessage }}
      </div>

      <button type="submit" class="btn-pixel submit-btn" [disabled]="isLoading">
        {{ isLoading ? 'CREATING...' : 'JOIN GAME' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login">Login Here</a></p>
    </div>
  </div>
</div>
