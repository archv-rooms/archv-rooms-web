<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <title>Archv Rooms — Your space. Your game.</title>
  <meta name="description" content="Archv Rooms é uma plataforma para criar, gerenciar e compartilhar salas de jogos online. Entre, jogue e divirta-se!" />

  <meta property="og:title" content="Archv Rooms" />
  <meta property="og:description" content="Crie e gerencie suas salas de jogos online com o Archv Rooms." />
  <meta property="og:image" content="https://archv-rooms-web.vercel.app/og-image.png" />
  <meta property="og:url" content="https://archv-rooms-web.vercel.app" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Archv Rooms" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Archv Rooms" />
  <meta name="twitter:description" content="Crie e gerencie suas salas de jogos online com o Archv Rooms." />
  <meta name="twitter:image" content="https://archv-rooms-web.vercel.app/og-image.png" />
</head>
<body>
  <div id="loading-screen">
    <div id="loading-content">
      <div id="loading-title">ARCHV.ROOMS</div>
      <div id="runner-container">
        <div id="ship">
          <pre class="sprite">
  /\
 /\/\
/____\
 |  |
          </pre>
        </div>
        <div id="laser-container">
          <span id="laser"></span>
        </div>
      </div>
      <div id="loading-line">
        <span id="loading-text"></span><span id="loading-cursor">_</span>
      </div>
    </div>
  </div>

  <app-root></app-root>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

    #loading-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #11131a;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease;
    }
    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    #loading-title {
      font-family: 'Press Start 2P', cursive;
      font-size: 36px;
      letter-spacing: 8px;
      color: #8b5cf6;
      text-shadow: 0 0 10px #8b5cf6;
      animation: blink-title 1.5s step-start infinite;
    }
    #runner-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 8px 0;
    }
    #ship {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .sprite {
      font-family: 'VT323', monospace;
      font-size: 22px;
      color: #8b5cf6;
      line-height: 1.2;
      margin: 0;
      text-align: center;
    }
    #laser-container {
      display: flex;
      justify-content: center;
      height: 20px;
    }
    #laser {
      display: inline-block;
      width: 3px;
      background: #fbbf24;
      animation: shoot 0.6s steps(1) infinite;
      height: 0;
    }
    #loading-line {
      font-family: 'VT323', monospace;
      font-size: 22px;
      letter-spacing: 3px;
      color: #9aa3c7;
      margin-top: 8px;
    }
    #loading-cursor {
      color: #8b5cf6;
      animation: blink-cursor 0.8s step-start infinite;
    }
    @keyframes blink-title {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    @keyframes blink-cursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes shoot {
      0%   { height: 0px;  opacity: 1; }
      30%  { height: 20px; opacity: 1; }
      60%  { height: 20px; opacity: 0; }
      100% { height: 0px;  opacity: 0; }
    }
  </style>

  <script>
    const messages = [
      'INICIALIZANDO SISTEMA...',
      'CARREGANDO BIBLIOTECA...',
      'ACESSANDO CARTUCHOS...',
      'PRONTO.',
    ];

    let msgIndex = 0;
    let charIndex = 0;
    const textEl = document.getElementById('loading-text');

    function typeNext() {
      if (msgIndex >= messages.length) {
        setTimeout(() => {
          const screen = document.getElementById('loading-screen');
          screen.classList.add('fade-out');
          setTimeout(() => screen.remove(), 800);
        }, 400);
        return;
      }
      const msg = messages[msgIndex];
      if (charIndex < msg.length) {
        textEl.textContent += msg[charIndex];
        charIndex++;
        setTimeout(typeNext, 50);
      } else {
        setTimeout(() => {
          textEl.textContent = '';
          charIndex = 0;
          msgIndex++;
          typeNext();
        }, 600);
      }
    }

    typeNext();
  </script>
</body>
</html>
