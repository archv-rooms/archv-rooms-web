<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <title>Archv Rooms — Your space. Your game.</title>
  <meta name="description" content="Archv Rooms é uma plataforma para criar, gerenciar e compartilhar salas de jogos online. Entre, jogue e divirta-se!" />

  <meta property="og:title" content="Archv Rooms" />
  <meta property="og:description" content="Crie e gerencie suas salas de jogos online com o Archv Rooms." />
  <meta property="og:image" content="https://archv-rooms-web.vercel.app/og-image.png" />
  <meta property="og:url" content="https://archv-rooms-web.vercel.app" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Archv Rooms" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Archv Rooms" />
  <meta name="twitter:description" content="Crie e gerencie suas salas de jogos online com o Archv Rooms." />
  <meta name="twitter:image" content="https://archv-rooms-web.vercel.app/og-image.png" />
</head>
<body>
  <div id="loading-screen">
    <div id="loading-content">
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>
      <div class="scanlines"></div>

      <div class="pixel-stage" id="pixel-stage">
        <div class="pixel-grid" id="pixel-grid" aria-hidden="true"></div>
        <span class="sr-only">ARCHV ROOMS</span>
        <span class="title-sub" id="logo-sub">your space &mdash; your game</span>
      </div>

      <div class="divider"></div>

      <div class="loading-area">
        <div class="progress-track">
          <div class="progress-fill" id="loading-progress"></div>
        </div>
        <div class="log-line">
          <span class="prompt">&gt;&nbsp;</span>
          <span id="loading-text"></span>
          <span id="loading-cursor">_</span>
        </div>
      </div>
    </div>
  </div>

  <app-root></app-root>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

    body { margin: 0; background: #0a0b10; }
    app-root { visibility: hidden; }

    #loading-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #0a0b10;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease;
    }
    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #loading-content {
      position: relative;
      width: 560px;
      background: #0d0e16;
      border: 1px solid #2a1f4e;
      border-radius: 4px;
      padding: 36px 40px 32px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      box-shadow:
        0 0 40px rgba(124,58,237,0.15),
        inset 0 0 60px rgba(124,58,237,0.03);
    }

    .scanlines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,0.18) 3px,
        rgba(0,0,0,0.18) 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    .corner {
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: #6d28d9;
      border-style: solid;
      opacity: 0.7;
    }
    .corner-tl { top: 10px; left: 10px; border-width: 2px 0 0 2px; }
    .corner-tr { top: 10px; right: 10px; border-width: 2px 2px 0 0; }
    .corner-bl { bottom: 10px; left: 10px; border-width: 0 0 2px 2px; }
    .corner-br { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    .pixel-stage {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 22px;
      min-height: 110px;
    }

    .pixel-grid {
      display: grid;
      gap: 1px;
      justify-content: center;
    }

    .pixel-cell {
      opacity: 0;
      transform: scale(0.4);
      border-radius: 1px;
    }
    .pixel-cell.show {
      animation: pixelPop 0.25s ease forwards;
    }

    .pixel-grid.settle {
      animation: settleFlicker 0.4s ease;
    }

    .title-sub {
      font-family: 'VT323', monospace;
      font-size: 15px;
      letter-spacing: 4px;
      color: #4b3d72;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .title-sub.show {
      opacity: 1;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(to right, transparent, #3b1f6e 20%, #7c3aed 50%, #3b1f6e 80%, transparent);
      margin-bottom: 20px;
    }

    .loading-area {
      width: 100%;
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: #12101e;
      border: 1px solid #2a1f4e;
      overflow: hidden;
      display: flex;
      align-items: center;
      padding: 2px 3px;
      box-sizing: border-box;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
      background-image: repeating-linear-gradient(
        90deg,
        #7c3aed 0px,
        #7c3aed 6px,
        transparent 6px,
        transparent 9px
      );
    }

    .log-line {
      font-family: 'VT323', monospace;
      font-size: 18px;
      letter-spacing: 2px;
      color: #9d8ec9;
      min-height: 22px;
    }
    .prompt { color: #7c3aed; }
    #loading-cursor {
      color: #7c3aed;
      animation: blink-cursor 0.7s step-start infinite;
    }

    @keyframes pixelPop {
      from { opacity: 0; transform: scale(0.4); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes settleFlicker {
      0% { opacity: 1; transform: none; }
      30% { opacity: 0.7; transform: skewX(-2deg); }
      60% { opacity: 1; transform: skewX(2deg); }
      100% { opacity: 1; transform: none; }
    }
    @keyframes blink-cursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

<script>
if (window.location.pathname !== '/') {
  document.getElementById('loading-screen').style.display = 'none';
  document.querySelector('app-root').style.visibility = 'visible';
}

(function buildPixelLogo() {
  const FONT = {
    A: ['01110','10001','10001','11111','10001','10001','10001'],
    C: ['01111','10000','10000','10000','10000','10000','01111'],
    H: ['10001','10001','10001','11111','10001','10001','10001'],
    M: ['10001','11011','10101','10101','10001','10001','10001'],
    O: ['01110','10001','10001','10001','10001','10001','01110'],
    R: ['11110','10001','10001','11110','10100','10010','10001'],
    S: ['01111','10000','10000','01110','00001','00001','11110'],
    V: ['10001','10001','10001','10001','10001','01010','00100']
  };

  const word = 'ARCHV ROOMS';
  const rows = 7;
  const matrix = Array.from({ length: rows }, () => []);

  word.split('').forEach((ch) => {
    if (ch === ' ') {
      for (let r = 0; r < rows; r++) matrix[r].push(0, 0, 0);
      return;
    }
    const glyph = FONT[ch];
    for (let r = 0; r < rows; r++) {
      glyph[r].split('').forEach((bit) => matrix[r].push(bit === '1' ? 1 : 0));
      matrix[r].push(0);
    }
  });

  const cols = matrix[0].length;
  const grid = document.getElementById('pixel-grid');
  const cellSize = Math.max(4, Math.min(8, Math.floor((440 - (cols - 1)) / cols)));

  grid.style.gridTemplateColumns = `repeat(${cols}, ${cellSize}px)`;
  grid.style.gridTemplateRows = `repeat(${rows}, ${cellSize}px)`;

  const litCells = [];

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement('div');
      cell.style.width = cellSize + 'px';
      cell.style.height = cellSize + 'px';
      if (matrix[r][c]) {
        cell.className = 'pixel-cell';
        cell.style.background = Math.random() < 0.18 ? '#d4537e' : '#7c3aed';
        litCells.push({ el: cell, col: c });
      }
      grid.appendChild(cell);
    }
  }

  let maxCol = 0;
  litCells.forEach(({ el, col }) => {
    if (col > maxCol) maxCol = col;
    setTimeout(() => el.classList.add('show'), col * 13);
  });

  setTimeout(() => {
    grid.classList.add('settle');
    document.getElementById('logo-sub').classList.add('show');
  }, maxCol * 13 + 380);
})();

const messages = [
  'INICIALIZANDO SISTEMA...',
  'CARREGANDO CARTUCHOS...',
  'BUSCANDO SAVES ANTIGOS...',
  'LIGANDO O FLIPERAMA...',
  'PRONTO JOGADOR 1.',
];

let msgIndex = 0, charIndex = 0;
const textEl = document.getElementById('loading-text');
const progEl = document.getElementById('loading-progress');

function showWelcomeMessage() {
  const isFirstVisit = !localStorage.getItem('archv-visited');
  if (!isFirstVisit) {
    document.querySelector('app-root').style.visibility = 'visible';
    return;
  }
  localStorage.setItem('archv-visited', '1');

  const screen = document.createElement('div');
  screen.id = 'welcome-screen';
  screen.style.cssText = `
    position: fixed; inset: 0;
    background: #0a0b10;
    z-index: 99998;
    display: flex; align-items: center; justify-content: center;
    font-family: 'VT323', monospace;
    transition: opacity 0.8s ease;
  `;

  screen.innerHTML = `
    <div style="
      position: relative;
      width: 520px;
      background: #0d0e16;
      border: 1px solid #2a1f4e;
      border-radius: 4px;
      padding: 40px;
      box-shadow: 0 0 40px rgba(124,58,237,0.2), inset 0 0 60px rgba(124,58,237,0.03);
      overflow: hidden;
    ">
      <div style="
        position: absolute; inset: 0;
        background: repeating-linear-gradient(to bottom, transparent 0px, transparent 3px, rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px);
        pointer-events: none; z-index: 10;
      "></div>
      <div style="position:absolute;top:10px;left:10px;width:14px;height:14px;border:2px solid #6d28d9;border-right:none;border-bottom:none;opacity:0.7"></div>
      <div style="position:absolute;top:10px;right:10px;width:14px;height:14px;border:2px solid #6d28d9;border-left:none;border-bottom:none;opacity:0.7"></div>
      <div style="position:absolute;bottom:10px;left:10px;width:14px;height:14px;border:2px solid #6d28d9;border-right:none;border-top:none;opacity:0.7"></div>
      <div style="position:absolute;bottom:10px;right:10px;width:14px;height:14px;border:2px solid #6d28d9;border-left:none;border-top:none;opacity:0.7"></div>

      <div style="position:relative;z-index:2;text-align:center;">
        <div style="
          font-size: 13px; letter-spacing: 4px;
          color: #f59e0b; margin-bottom: 6px;
          animation: wcBlink 1s step-start infinite;
        ">★ INSERT COIN TO CONTINUE ★</div>

        <div style="width:100%;height:1px;background:linear-gradient(to right,transparent,#7c3aed,transparent);margin:16px 0;"></div>

        <div style="font-size:28px;letter-spacing:6px;color:#fff;margin-bottom:4px;">ARCHV ROOMS</div>
        <div style="font-size:14px;letter-spacing:3px;color:#4b3d72;margin-bottom:24px;">YOUR SPACE — YOUR GAME</div>

        <div style="width:100%;height:1px;background:linear-gradient(to right,transparent,#7c3aed,transparent);margin-bottom:24px;"></div>

        <div id="wc-lines" style="
          text-align: left;
          font-size: 17px;
          letter-spacing: 2px;
          color: #9d8ec9;
          line-height: 1.8;
          min-height: 160px;
        "></div>

        <div style="width:100%;height:1px;background:linear-gradient(to right,transparent,#7c3aed,transparent);margin:24px 0 20px;"></div>

        <button id="wc-start" style="
          display: none;
          background: #7c3aed; border: none;
          color: #fff; font-family: 'VT323', monospace;
          font-size: 20px; letter-spacing: 4px;
          padding: 12px 40px; cursor: pointer;
          animation: wcBlink 0.8s step-start infinite;
        ">▶ PRESSIONE START</button>
      </div>
    </div>

    <style>
      @keyframes wcBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  `;

  document.body.appendChild(screen);

  const lines = [
    { text: '> BEM-VINDO, JOGADOR.', color: '#a78bfa' },
    { text: '', color: '' },
    { text: '  ARCHV ROOMS É UMA PLATAFORMA', color: '#9d8ec9' },
    { text: '  DE JOGOS CLÁSSICOS DOS ANOS', color: '#9d8ec9' },
    { text: '  80 E 90 DIRETO NO NAVEGADOR.', color: '#9d8ec9' },
    { text: '', color: '' },
    { text: '  + 40 TÍTULOS DISPONÍVEIS', color: '#4ade80' },
    { text: '  CRIE SUA CONTA E COMECE', color: '#4ade80' },
    { text: '  A JOGAR AGORA MESMO.', color: '#4ade80' },
  ];

  const linesEl = document.getElementById('wc-lines');
  const startBtn = document.getElementById('wc-start');
  let lineIndex = 0;

  function typeLine() {
    if (lineIndex >= lines.length) {
      startBtn.style.display = 'inline-block';
      startBtn.onclick = () => {
        document.querySelector('app-root').style.visibility = 'visible';
        screen.style.opacity = '0';
        setTimeout(() => screen.remove(), 800);
      };
      return;
    }
    const { text, color } = lines[lineIndex];
    const lineEl = document.createElement('div');
    lineEl.style.color = color;
    linesEl.appendChild(lineEl);

    if (!text) {
      lineIndex++;
      setTimeout(typeLine, 100);
      return;
    }

    let i = 0;
    const type = setInterval(() => {
      lineEl.textContent += text[i++];
      if (i >= text.length) {
        clearInterval(type);
        lineIndex++;
        setTimeout(typeLine, 200);
      }
    }, 35);
  }

  setTimeout(typeLine, 400);
}

function typeNext() {
  if (msgIndex >= messages.length) {
    progEl.style.width = '100%';
    setTimeout(() => {
      const screen = document.getElementById('loading-screen');
      screen.classList.add('fade-out');
      setTimeout(() => {
        screen.remove();
        showWelcomeMessage();
      }, 800);
    }, 400);
    return;
  }
  progEl.style.width = ((msgIndex / messages.length) * 100) + '%';
  const msg = messages[msgIndex];
  if (charIndex < msg.length) {
    textEl.textContent += msg[charIndex++];
    setTimeout(typeNext, 45);
  } else {
    setTimeout(() => {
      textEl.textContent = '';
      charIndex = 0;
      msgIndex++;
      typeNext();
    }, 700);
  }
}

typeNext();
</script>
</body>
</html>
